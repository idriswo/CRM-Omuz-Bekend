services:
  - type: web
    name: omuz-crm-backend
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push && npx prisma db seed && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: omuz-crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 3h
      - key: REFRESH_TOKEN_TTL
        value: 7d
      - key: SEED_DIRECTOR_EMAIL
        sync: false # дар Render дастӣ гузошта мешавад
      - key: SEED_DIRECTOR_PASSWORD
        sync: false # дастӣ — набояд дар repo бошад
      # Gmail SMTP. Холӣ монад, барнома дар режими stub кор мекунад (email намеравад).
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: MAIL_FROM_NAME
        value: Omuz CRM
      - key: PORT
        value: 4000

databases:
  - name: omuz-crm-db
    plan: free
    databaseName: omuz_crm
    user: omuz_crm
