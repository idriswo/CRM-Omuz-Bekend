services:
  - type: web
    name: omuz-crm-backend
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    # `prisma db push` набояд дар production кор кунад: он таърихи миграция
    # надорад ва ҳангоми тағйири схема бо маълумоти мавҷуда деплойро мешиканад
    # (маҳз ҳамин ҳангоми илова кардани User.email рӯй дод).
    # `migrate deploy` танҳо миграцияҳои нави татбиқнашударо иҷро мекунад.
    startCommand: npx prisma migrate deploy && npx prisma db seed && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: omuz-crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 3h
      - key: REFRESH_TOKEN_TTL
        value: 7d
      - key: SEED_DIRECTOR_EMAIL
        sync: false # дар Render дастӣ гузошта мешавад
      - key: SEED_DIRECTOR_PASSWORD
        sync: false # дастӣ — набояд дар repo бошад
      # Email тавассути Brevo (HTTP API, порти 443). Gmail SMTP ин ҷо кор
      # намекунад: плани Free-и Render портҳои 25/465/587-ро мебандад.
      # Холӣ монад, барнома дар режими stub кор мекунад (email намеравад).
      - key: BREVO_API_KEY
        sync: false # дастӣ дар Render гузошта мешавад — набояд дар repo бошад
      # Бояд дар Brevo ҳамчун sender тасдиқшуда бошад (домен лозим нест).
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: Omuz CRM
      - key: PORT
        value: 4000

databases:
  - name: omuz-crm-db
    plan: free
    databaseName: omuz_crm
    user: omuz_crm
